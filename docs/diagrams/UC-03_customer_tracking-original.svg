21.4413,779.9376,224.2059,777.1729,229.1412,784.75,222.8493" style="stroke: #475569; stroke-width: 1.0;"/><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="48" x="621.5" y="349.9355">«extend»</text><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="131" x="580" y="363.2451">[parcel not yet delivered]</text><!--link C13 to C11--><path d="M834.5,290.0393 C834.5,273.3893 834.5,249.8093 834.5,232.6093 " fill="none" id="C13-C11" style="stroke: #475569; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#475569" points="834.5,227.4893,830.5,236.4893,834.5,232.4893,838.5,236.4893,834.5,227.4893" style="stroke: #475569; stroke-width: 1.0;"/><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="48" x="793.5" y="256.4355">«extend»</text><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="115" x="760" y="269.7451">[status = DELIVERED]</text><!--link C14 to C12--><path d="M521.03,306.4893 C577.72,311.2293 649.74,320.2193 712,337.2793 C726.27,341.1893 756.85,354.5393 783.76,366.8593 " fill="none" id="C14-C12" style="stroke: #475569; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#475569" points="788.39,368.9893,781.8798,361.5989,783.846,366.9031,778.5419,368.8693,788.39,368.9893" style="stroke: #475569; stroke-width: 1.0;"/><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="51" x="620" y="310.9355">«include»</text><!--link N1 to N2--><!--link N1 to N3--><!--
@startuml UC-03_customer_tracking
skinparam shadowing false
skinparam defaultFontName Arial
skinparam defaultFontSize 13
skinparam backgroundColor #FFFFFF
skinparam packageStyle rectangle
skinparam ArrowColor #475569
skinparam ArrowFontColor #475569
skinparam ArrowFontSize 11
skinparam ActorBorderColor #0F1A2E
skinparam ActorBackgroundColor #FFF1E7
skinparam ActorFontStyle bold
skinparam UsecaseBorderColor #C2410C
skinparam UsecaseBackgroundColor #FFF6EF
skinparam UsecaseFontColor #0F1A2E
skinparam RectangleBorderColor #0F1A2E
skinparam RectangleBorderThickness 1.5
skinparam RectangleFontStyle bold
skinparam RectangleFontSize 15
skinparam NoteBackgroundColor #F1F5F9
skinparam NoteBorderColor #94A3B8
skinparam NoteFontSize 11
skinparam TitleFontSize 18
skinparam TitleFontStyle bold
left to right direction
title SwiftDrop - Tracking, History & Receipts

actor "Customer" as Customer
actor "Visitor\n(not logged in)" as Visitor
actor "Email / SMS\nGateway" as Notify <<external>>

rectangle "SwiftDrop Platform" {
  usecase "View my deliveries\n(delivery history)" as C10
  usecase "View parcel details" as C11
  usecase "View status history\n(who, when, note, proof)" as C11a
  usecase "Track delivery live\n(Server-Sent Events)" as C12
  usecase "Download receipt (PDF)" as C13
  usecase "Track parcel by\ntracking number (public)" as C14
  usecase "Receive status\nnotifications" as C15
}

Customer - -> C10
Customer - -> C11
Visitor - -> C14
C15 - -> Customer
C15 - - Notify

C11 ..> C11a : <<include>>
C12 .> C11 : <<extend>>\n[parcel not yet delivered]
C13 .> C11 : <<extend>>\n[status = DELIVERED]
C14 ..> C12 : <<include>>

note as N1
  A customer can only see their own
  parcels (other parcels return 403/404).
end note
note as N2
  Phone-first page. Shows status and
  progress only, with no personal data.
end note
note as N3
  Sent on every status change:
  CREATED → PICKED_UP → IN_TRANSIT →
  OUT_FOR_DELIVERY → DELIVERED / FAILED
end note
@enduml

