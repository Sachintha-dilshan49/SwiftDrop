73" fill="#1E2A3A" font-size="22.917" textLength="136.303" font-family="Helvetica">[model given]</text></g><!--reverse link UC_CHAT to UC_STREAM--><g class="link" data-entity-1="ent0004" data-entity-2="ent0013" id="lnk23" data-source-line="82" data-link-type="dependency"><path d="M973.532,400.354 C1035.698,369.375 1116.583,332.729 1199.813,308.333 C1327.979,270.771 1476.396,247.333 1592.75,233.292" style="stroke:#1E2A3A;stroke-width:2.083;stroke-dasharray:14.583,14.583;" fill="none" id="UC_CHAT-backto-UC_STREAM"/><polygon points="964.208,405,984.707,404.096,973.532,400.354,977.273,389.179,964.208,405" fill="#1E2A3A" style="stroke:#1E2A3A;stroke-width:2.083;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1305.489" y="217.125" fill="#1E2A3A" font-size="22.917" textLength="94.296" font-family="Helvetica">«extend»</text><text x="1257.104" y="240.042" fill="#1E2A3A" font-size="22.917" textLength="191.065" font-family="Helvetica">[stream requested]</text></g><g class="legend" data-source-line="85"><rect x="1222.772" y="972.938" width="814.29" height="145.833" fill="none" style="stroke:#1E2A3A;stroke-width:2.083;" rx="15.625" ry="15.625"/><text x="1233.189" y="1002.605" fill="#000" font-size="25" textLength="720.386" font-family="Helvetica">All routes are /api/v1/... through the gateway with the user's JWT.</text><text x="1233.189" y="1027.605" fill="#000" font-size="25" textLength="768.384" font-family="Helvetica">Tools are read-only and call the owning services with that same JWT,</text><text x="1233.189" y="1052.605" fill="#000" font-size="25" textLength="793.457" font-family="Helvetica">so users only ever see their own data. The LLM provider (Groq) and the</text><text x="1233.189" y="1077.605" fill="#000" font-size="25" textLength="739.331" font-family="Helvetica">parcel, pricing and auth services are used behind these use cases.</text><text x="1233.189" y="1102.605" fill="#000" font-size="25" textLength="626.697" font-family="Helvetica">MCP clients get the same tools and bring their own LLM.</text></g><?plantuml-src dLPTRkCs47xNAGRfGnmWTkBiNnga0RIolElMJWnRQO4sYu2H9Z9XcjIIj5rtiK0FqLlq27tRe_Ga7OgoBJjPBD0WKABv-MOuyyrGXp1UyaVRqQg0i0UXCTnO9YqquNRGXrk3435wT3ZBDPj1OwG4mlT7mI6CK6QeBs3O3wyJChxlzmQzv7xS-pN-eVtwnVbBA0GXpMS2chQGEJtD8eUvmPGGcumtsJfQgo2h831JBWlcmcG5XxFJqvh4J5YcbfnW7famMBV5HpONjgkalMOpXFSe5cXvofwt6VC_4DelQagMMgN7TaK7OqiqQbP7bof3WmMqpsj2pUJK2T_KCmorLij82QNXktPy5hu8zvKk_3SDV7xjcifoAt2hEjzF7Ju506zPEisrcikiYj0zU_sstN4QfQbFbJGwUzK-xPAqn2lF_A14LWbsa_jS2rHrxIkXkjsNyTlzKDtJD-7PLffCU3gLQ0oqMw--6KzZIiJ8HHMnZbjPFvy7_P1cv8LQeeRphntML_FLJbYfxDVFwB6Vp-NPY6M0ivq00dCQc_yLOXSoA5bHczxcplm6WS172rQ1vld4GiPTHRcI0Ktklt_zIRymr7p6zCgJo433UHnLoi0pws3CSubPaqkt2lITR4Itu-Hc48-EWHxHUnhzOuXkRaSz4jt9Jcyy39FelTE7dK7l6ZJjYwC3OAO4MCF6lrlKaWaOH4E814Tf2HjRUOlUs3oZXODcQbNXNGTf4GHRIXpiR2fer5S9N9oVdhyXDrVYDMiFeWcpiEHs0dP2KxuslfF3ct429nl1IKg6FjledawNr47wP0DimRXW3vG59J6ZvI3CdNmNxu1uyHfcSDE9--CwK0S54iyOf4ekK1lc6aF5Y_jn4kzaKzERaqyy-xm69TiwejlJMofOfLnM_copjDXa4Ws3kjVF79SmMm5HCotFqPYjxgkN4kHeuzcxZkkUOoIh2KnG5C0qBLk1pdqgrL9WbjESaTanZC9t6mZwluwGQA8_bS278r_h15NqtU39A8n-gll6nX9pomfIeJcLQ0MFY8v1bUQUNdT1kd6yImYbw2-JcpQITtLBN02DvSUDvx2t6ts4AL9C2cwiHhfnCjfMXLWzJwOJRxG66oUZE1ou-JtSpfynAkM-oT2GYYfATy44MMQE0ZSrq6nk-5XxhuXLapXMqAoizQxTX_3bRovJGJFrvPyBO6B9LWOAr8zAK-f1XGkjrbNL9RY0oylAvUhA8o3DgymSW2fSdamSWv9Y1NFt3L0E5N4ruqv7LxLQoWtmPQkrQM89xR6khkxaRynC3R07DRSR9dpOTwJ6FUj6-JidpLDyukFekk-qNbn0VklLTIStK9JoUWwUm3a6xCELd86SY22VsFicxtju8X1NFiw9ffXz2DoIBg-31sMjclbLJLGBXQ2zERT8nT58Z2huoQ9zqY9qEo55xjTOJaIdRcxt6b5K7nhuyPUaHIY9sm8b0CNDccMx60LB6S4xSpgo-vuYfmKLqQnnQ5CQznr5CCS4OrI9Qto_aOQDFD01S5-rZ5dMWeG0-_q1DKGjkED4uvqReZ8YsHAGh-vnsJ8NrsdOd49k4d2vKYog1qwuzpEb1Dpa6NSeTr-avNrX84TRdgFCrlhJkc9gXxxDZx9g1LHbN-lWFm00?></g></svg>