dth: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#475569" points="433.58,247.2893,424.0067,244.976,428.6618,248.19,425.4478,252.8451,433.58,247.2893" style="stroke: #475569; stroke-width: 1.0;"/><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="48" x="275.5" y="405.4355">«extend»</text><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="103" x="248" y="418.7451">[user picks Google]</text><!--link C03 to Google--><path d="M505.27,453.8093 C565.3,474.2093 675.8,511.7593 733.2,531.2693 " fill="none" id="C03-Google" style="stroke: #475569; stroke-width: 1.0;"/><!--link C02b to C02a--><path d="M530.01,308.8993 C559.21,308.2893 593.91,306.6493 625,302.7793 C645.69,300.1993 667.81,296.1493 688.37,291.8193 " fill="none" id="C02b-C02a" style="stroke: #475569; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#475569" points="693.29,290.7693,683.6545,288.7304,688.3995,291.8101,685.3198,296.5552,693.29,290.7693" style="stroke: #475569; stroke-width: 1.0;"/><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="51" x="573" y="299.4355">«include»</text><!--link C04 to C04a--><path d="M497.5,378.0793 C518.79,380.5893 546.97,383.5093 572,384.7793 C609.47,386.6793 650.98,386.4193 686.27,385.4893 " fill="none" id="C04-C04a" style="stroke: #475569; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#475569" points="691.43,385.3493,682.3194,381.608,686.432,385.4921,682.5479,389.6047,691.43,385.3493" style="stroke: #475569; stroke-width: 1.0;"/><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="51" x="573" y="381.4355">«include»</text><!--
@startuml UC-01_customer_account
skinparam shadowing false
skinparam defaultFontName Arial
skinparam defaultFontSize 13
skinparam backgroundColor #FFFFFF
skinparam packageStyle rectangle
skinparam ArrowColor #475569
skinparam ArrowFontColor #475569
skinparam ArrowFontSize 11
skinparam ActorBorderColor #0F1A2E
skinparam ActorBackgroundColor #FFF1E7
skinparam ActorFontStyle bold
skinparam UsecaseBorderColor #C2410C
skinparam UsecaseBackgroundColor #FFF6EF
skinparam UsecaseFontColor #0F1A2E
skinparam RectangleBorderColor #0F1A2E
skinparam RectangleBorderThickness 1.5
skinparam RectangleFontStyle bold
skinparam RectangleFontSize 15
skinparam NoteBackgroundColor #F1F5F9
skinparam NoteBorderColor #94A3B8
skinparam NoteFontSize 11
skinparam TitleFontSize 18
skinparam TitleFontStyle bold
left to right direction
title SwiftDrop - Customer Account & Sign-in

actor "Visitor\n(not logged in)" as Visitor
actor "Customer" as Customer
actor "Google\n(OAuth 2.0)" as Google <<external>>

rectangle "SwiftDrop - Auth Service" {
  usecase "Sign up with email\nand password" as C01
  usecase "Validate input &\nhash password (BCrypt)" as C01a
  usecase "Log in" as C02
  usecase "Log in with Google" as C03
  usecase "Issue access token (15 min)\n& refresh token (7 days)" as C02a
  usecase "Refresh session" as C02b
  usecase "Log out" as C04
  usecase "Revoke refresh token" as C04a
}

Visitor - -> C01
Visitor - -> C02
Customer - -> C04
Customer - -> C02b

C01 ..> C01a : <<include>>
C01 ..> C02a : <<include>>
C02 ..> C02a : <<include>>
C03 .> C02 : <<extend>>\n[user picks Google]
C03 - - Google
C02b ..> C02a : <<include>>
C04 ..> C04a : <<include>>

note as N1
  OAuth 2.0 Authorization Code flow.
  First-time Google users are created
  with the CUSTOMER role.
end note
note as N2
  Done automatically by the web app
  when the API returns 401.
end note
@enduml

