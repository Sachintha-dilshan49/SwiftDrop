t="spacingAndGlyphs" textLength="186" x="12" y="131.7451">First-time Google users are created</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="134" x="12" y="145.0547">with the CUSTOMER role.</text><path d="M8,30.2793 L8,66.8984 L215,66.8984 L215,40.2793 L205,30.2793 L8,30.2793 " fill="#F1F5F9" style="stroke: #94A3B8; stroke-width: 1.0;"/><path d="M205,30.2793 L205,40.2793 L215,40.2793 L205,30.2793 " fill="#F1F5F9" style="stroke: #94A3B8; stroke-width: 1.0;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="186" x="14" y="45.9355">Done automatically by the web app</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="135" x="14" y="59.2451">when the API returns 401.</text><!--link Visitor to C01--><path d="M158.19,226.4093 C217.19,215.6093 320.53,196.6893 390.1,183.9493 " fill="none" id="Visitor-C01" style="stroke: #475569; stroke-width: 1.0;"/><polygon fill="#475569" points="395.05,183.0393,385.4767,180.726,390.1318,183.94,386.9178,188.5951,395.05,183.0393" style="stroke: #475569; stroke-width: 1.0;"/><!--link Visitor to C02--><path d="M158.19,235.9593 C229.1,237.7793 364.06,241.2593 427.47,242.8893 " fill="none" id="Visitor-C02" style="stroke: #475569; stroke-width: 1.0;"/><polygon fill="#475569" points="432.64,243.0193,423.7461,238.7886,427.6417,242.8904,423.5399,246.786,432.64,243.0193" style="stroke: #475569; stroke-width: 1.0;"/><!--link Customer to C04--><path d="M143.21,359.1893 C206.44,362.0793 351.15,368.7093 421.76,371.9393 " fill="none" id="Customer-C04" style="stroke: #475569; stroke-width: 1.0;"/><polygon fill="#475569" points="427.13,372.1793,418.3226,367.7713,422.1352,371.9503,417.9563,375.7629,427.13,372.1793" style="stroke: #475569; stroke-width: 1.0;"/><!--link Customer to C02b--><path d="M143.21,353.4693 C200.39,345.4593 324.19,328.0993 399.58,317.5293 " fill="none" id="Customer-C02b" styl