 616.31,271.7793 661.63,271.7793 " fill="none" id="C19-C10" style="stroke: #475569; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#475569" points="666.82,271.7793,657.82,267.7793,661.82,271.7793,657.82,275.7793,666.82,271.7793" style="stroke: #475569; stroke-width: 1.0;"/><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="51" x="585" y="268.4355">«include»</text><!--
@startuml UC-04_customer_ai_assistant
skinparam shadowing false
skinparam defaultFontName Arial
skinparam defaultFontSize 13
skinparam backgroundColor #FFFFFF
skinparam packageStyle rectangle
skinparam ArrowColor #475569
skinparam ArrowFontColor #475569
skinparam ArrowFontSize 11
skinparam ActorBorderColor #0F1A2E
skinparam ActorBackgroundColor #FFF1E7
skinparam ActorFontStyle bold
skinparam UsecaseBorderColor #C2410C
skinparam UsecaseBackgroundColor #FFF6EF
skinparam UsecaseFontColor #0F1A2E
skinparam RectangleBorderColor #0F1A2E
skinparam RectangleBorderThickness 1.5
skinparam RectangleFontStyle bold
skinparam RectangleFontSize 15
skinparam NoteBackgroundColor #F1F5F9
skinparam NoteBorderColor #94A3B8
skinparam NoteFontSize 11
skinparam TitleFontSize 18
skinparam TitleFontStyle bold
left to right direction
title SwiftDrop - AI Assistant (Customer)

actor "Customer" as Customer
actor "LLM Provider" as LLM <<external>>

rectangle "SwiftDrop Platform" {
  usecase "Chat with AI assistant" as C16
  usecase "Ask where my parcel is\n(track_parcel)" as C17
  usecase "Ask for a fee estimate\n(estimate_fee)" as C18
  usecase "List my parcels\n(my_parcels)" as C19
  usecase "Refuse unrelated or\nunauthorised questions" as C20
  usecase "View parcel details" as C11
  usecase "Get fee estimate" as C08
  usecase "View my deliveries" as C10
}

Customer - -> C16
C16 - - LLM

C17 .> C16 : <<extend>>
C18 .> C16 : <<extend>>
C19 .> C16 : <<extend>>
C20 .> C16 : <<extend>>\n[off-topic or another\nuser's data]

C17 ..> C11 : <<include>>
C18 ..> C08 : <<include>>
C19 ..> C10 : <<include>>

note as N1
  Tools call the API gateway with the
  customer's own token, so the assistant
  only sees what the customer may see.
  e.g. "Where is my parcel?"
       "How much to send 2 kg to Kandy?"
end note
@enduml

