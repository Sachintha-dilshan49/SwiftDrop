-C08" style="stroke: #475569; stroke-width: 1.0;"/><polygon fill="#475569" points="599.79,334.0293,590.7786,330.055,594.79,334.0436,590.8015,338.055,599.79,334.0293" style="stroke: #475569; stroke-width: 1.0;"/><!--link C05 to C06--><path d="M432.55,185.8993 C477.92,199.8093 552.85,222.7793 605.77,239.0093 " fill="none" id="C05-C06" style="stroke: #475569; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#475569" points="610.82,240.5593,603.3807,234.1051,606.038,239.0989,601.0441,241.7562,610.82,240.5593" style="stroke: #475569; stroke-width: 1.0;"/><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="51" x="506" y="205.4355">«include»</text><!--link C05 to C07--><path d="M457.24,173.7793 C494.63,173.7793 542.21,173.7793 582.6,173.7793 " fill="none" id="C05-C07" style="stroke: #475569; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#475569" points="587.99,173.7793,578.99,169.7793,582.99,173.7793,578.99,177.7793,587.99,173.7793" style="stroke: #475569; stroke-width: 1.0;"/><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="51" x="506" y="170.4355">«include»</text><!--link C05 to C08--><path d="M413.35,188.6093 C448.05,213.5193 521.4,264.4793 588,299.7793 C600.46,306.3793 614.47,312.7393 627.19,318.1293 " fill="none" id="C05-C08" style="stroke: #475569; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#475569" points="631.82,320.0693,625.0775,312.8902,627.2118,318.129,621.9731,320.2633,631.82,320.0693" style="stroke: #475569; stroke-width: 1.0;"/><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="51" x="506" y="248.4355">«include»</text><!--link C05 to C09--><path d="M435.51,162.1393 C484.88,148.6293 566.15,126.3793 618.09,112.1693 " fill="none" id="C05-C09" style="stroke: #475569; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#475569" points="623.03,110.8193,613.2902,109.3576,618.2102,112.1494,615.4184,117.0694,623.03,110.8193" style="stroke: #475569; stroke-width: 1.0;"/><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="51" x="506" y="126.4355">«include»</text><!--link C09 to C09a--><path d="M735.58,100.7793 C771.02,101.8393 815.56,103.1793 856.21,104.3993 " fill="none" id="C09-C09a" style="stroke: #475569; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#475569" points="861.66,104.5593,852.7901,100.2786,856.6625,104.4022,852.5388,108.2746,861.66,104.5593" style="stroke: #475569; stroke-width: 1.0;"/><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="51" x="779" y="99.4355">«include»</text><!--link C09b to C05--><path d="M392,264.6193 C392,245.0693 392,214.8193 392,194.6593 " fill="none" id="C09b-C05" style="stroke: #475569; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#475569" points="392,189.5193,388,198.5193,392,194.5193,396,198.5193,392,189.5193" style="stroke: #475569; stroke-width: 1.0;"/><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="48" x="344.5" y="218.1855">«extend»</text><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="87" x="325" y="231.4951">[invalid address,</text><text fill="#475569" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="78" x="329.5" y="244.8047">size or weight]</text><!--
@startuml UC-02_customer_booking
skinparam shadowing false
skinparam defaultFontName Arial
skinparam defaultFontSize 13
skinparam backgroundColor #FFFFFF
skinparam packageStyle rectangle
skinparam ArrowColor #475569
skinparam ArrowFontColor #475569
skinparam ArrowFontSize 11
skinparam ActorBorderColor #0F1A2E
skinparam ActorBackgroundColor #FFF1E7
skinparam ActorFontStyle bold
skinparam UsecaseBorderColor #C2410C
skinparam UsecaseBackgroundColor #FFF6EF
skinparam UsecaseFontColor #0F1A2E
skinparam RectangleBorderColor #0F1A2E
skinparam RectangleBorderThickness 1.5
skinparam RectangleFontStyle bold
skinparam RectangleFontSize 15
skinparam NoteBackgroundColor #F1F5F9
skinparam NoteBorderColor #94A3B8
skinparam NoteFontSize 11
skinparam TitleFontSize 18
skinparam TitleFontStyle bold
left to right direction
title SwiftDrop - Book a Delivery

actor "Customer" as Customer

rectangle "SwiftDrop Platform" {
  usecase "Book a delivery" as C05
  usecase "Enter pickup and\ndrop-off address" as C06
  usecase "Enter package size\nand weight" as C07
  usecase "Get fee estimate" as C08
  usecase "Confirm booking" as C09
  usecase "Receive tracking number\n(e.g. SD-7K3Q-9P2M)" as C09a
  usecase "Show validation errors" as C09b
}

Customer - -> C05
Customer - -> C08

C05 ..> C06 : <<include>>
C05 ..> C07 : <<include>>
C05 ..> C08 : <<include>>
C05 ..> C09 : <<include>>
C09 ..> C09a : <<include>>
C09b .> C05 : <<extend>>\n[invalid address,\nsize or weight]

note as N1
  Fee comes from the pricing service:
  zone + base fare + per-km rate.
  The customer sees the fee before
  confirming (e.g. 2 kg Colombo → Kandy).
end note
note as N2
  Parcel is created with status CREATED
  and a ParcelStatusChanged event is
  published for notifications.
end note
@enduml

