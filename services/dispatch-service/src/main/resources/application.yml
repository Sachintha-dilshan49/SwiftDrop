spring:
  application:
    name: dispatch-service
  datasource:
    url: ${DISPATCH_DB_URL:jdbc:postgresql://localhost:5432/dispatch_db}
    username: ${DISPATCH_DB_USER:dispatch}
    password: ${DISPATCH_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # auth-service JWKS, called directly (not through the gateway)
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

server:
  port: 8084

swiftdrop:
  security:
    # Paths that need no token, e.g. /api/v1/track/**. Health and /v3/api-docs are always public.
    public-paths: []
  services:
    # parcel-service owns parcel status; dispatch calls its /internal API directly
    parcel-url: ${PARCEL_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
