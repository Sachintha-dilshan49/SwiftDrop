spring:
  application:
    name: dispatch-service
  datasource:
    url: ${DISPATCH_DB_URL:jdbc:postgresql://localhost:5432/dispatch_db}
    username: ${DISPATCH_DB_USER:dispatch}
    password: ${DISPATCH_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # proof photos; phones produce 2-4 MB JPEGs
      max-file-size: 5MB
      max-request-size: 6MB
  security:
    oauth2:
      resourceserver:
        jwt:
          # auth-service JWKS, called directly (not through the gateway)
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

server:
  port: 8084

swiftdrop:
  security:
    # Paths that need no token, e.g. /api/v1/track/**. Health and /v3/api-docs are always public.
    public-paths: []
  services:
    # parcel-service owns parcel status; dispatch calls its /internal API directly
    parcel-url: ${PARCEL_SERVICE_URL:http://localhost:8083}
  storage:
    # MinIO (S3 API) for proof-of-delivery photos; the bucket is created by Role 8's minio-init
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET_DELIVERY_PROOFS:delivery-proofs}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
