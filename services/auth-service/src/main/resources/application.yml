
spring:
  application:
    name: auth-service

  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${AUTH_DB_USER:auth}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

  # Password reset emails. Defaults suit Mailpit; AUTH_MAIL_* override the shared MAIL_* settings so reset emails
  # can use a real mail server (e.g. Gmail) while notifications stay on Mailpit.
  mail:
    host: ${AUTH_MAIL_HOST:${MAIL_HOST:localhost}}
    port: ${AUTH_MAIL_PORT:${MAIL_PORT:1025}}
    username: ${AUTH_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${AUTH_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${AUTH_MAIL_SMTP_AUTH:${MAIL_SMTP_AUTH:false}}
          starttls:
            enable: ${AUTH_MAIL_SMTP_STARTTLS:${MAIL_SMTP_STARTTLS:false}}
            required: ${AUTH_MAIL_SMTP_STARTTLS:${MAIL_SMTP_STARTTLS:false}}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      resourceserver:
        jwt:
          # auth-service JWKS, called directly (not through the gateway)
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

server:
  port: 8081
  # Behind nginx and the gateway: build Google's callback address from X-Forwarded-Host/Proto
  forward-headers-strategy: framework

swiftdrop:
  internal.token: ${INTERNAL_API_TOKEN:}   # shared /internal/** token, ADR-010; startup fails if unset
  security:
    public-paths:
      - /api/v1/auth/**
      - /.well-known/jwks.json
      - /oauth2/**
      - /login/oauth2/**
  jwt:
    private-key-base64: ${JWT_PRIVATE_KEY_B64:}
    key-id: ${JWT_KEY_ID:swiftdrop-auth-1}
    issuer: ${JWT_ISSUER:swiftdrop-auth}
  google:
    enabled: ${AUTH_GOOGLE_ENABLED:false}
    client-id: ${AUTH_GOOGLE_CLIENT_ID:}
    client-secret: ${AUTH_GOOGLE_CLIENT_SECRET:}
    frontend-success-uri: ${AUTH_OAUTH_SUCCESS_REDIRECT_URI:http://localhost:3000/auth/callback}
  # Demo staff accounts (admin, dispatcher, courier); off unless a password is set. Local and demo use only.
  demo-accounts:
    password: ${AUTH_DEMO_ACCOUNTS_PASSWORD:}
  password-reset:
    reset-url: ${AUTH_PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    from-email: ${AUTH_FROM_EMAIL:noreply@swiftdrop.lk}
    # Demo only: send every account's reset emails to this address (stored in users.password_reset_email)
    default-recipient: ${AUTH_PASSWORD_RESET_DEFAULT_EMAIL:}
  identity-storage:
    enabled: ${AUTH_IDENTITY_STORAGE_ENABLED:false}
    endpoint: ${AUTH_IDENTITY_STORAGE_ENDPOINT:}
    access-key: ${AUTH_IDENTITY_STORAGE_ACCESS_KEY:}
    secret-key: ${AUTH_IDENTITY_STORAGE_SECRET_KEY:}
    bucket: ${AUTH_IDENTITY_STORAGE_BUCKET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # A mail server outage must not mark auth-service unhealthy
    mail:
      enabled: false

logging:
  level:
    org.flywaydb: INFO