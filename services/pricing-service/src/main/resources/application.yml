spring:
  application:
    name: pricing-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # auth-service JWKS, called directly (not through the gateway)
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

  datasource:
    url: ${PRICING_DB_URL:jdbc:postgresql://localhost:5432/pricing_db}
    username: ${PRICING_DB_USER:pricing}
    password: ${PRICING_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: 8082

swiftdrop:
  internal.token: ${INTERNAL_API_TOKEN:}   # shared /internal/** token, ADR-010; startup fails if unset
  security:
    # Paths that need no token, e.g. /api/v1/track/**. Health and /v3/api-docs are always public.
    public-paths: []

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
