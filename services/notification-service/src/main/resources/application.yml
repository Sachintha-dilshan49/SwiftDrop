spring:
  application:
    name: notification-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${NOTIFICATION_DB_USERNAME:swiftdrop}
    password: ${NOTIFICATION_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # A failing event is retried 3 times with back-off, then dropped instead of being requeued forever
        # (an endless redelivery loop would also resend every notification sent before the failure)
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

  # Defaults suit Mailpit; set MAIL_USERNAME, MAIL_PASSWORD and MAIL_SMTP_* for a real mail server
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8086

swiftdrop:
  internal.token: ${INTERNAL_API_TOKEN:}   # shared /internal/** token, ADR-010; startup fails if unset
  security:
    public-paths: []
  notification:
    from-email: ${NOTIFICATION_FROM_EMAIL:noreply@swiftdrop.lk}
    tracking-base-url: ${TRACKING_BASE_URL:http://localhost:3000/track}
  services:
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    merchant-url: ${MERCHANT_SERVICE_URL:http://localhost:8085}
    parcel-url: ${PARCEL_SERVICE_URL:http://localhost:8083}

rabbitmq:
  queues:
    notification: notification.q
    webhook: webhook.q
    webhook-retry-10s: webhook.retry.10s
    webhook-retry-1m: webhook.retry.1m
    webhook-retry-5m: webhook.retry.5m
    webhook-parking: webhook.parking
  dlx:
    webhook: webhook.dlx

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
