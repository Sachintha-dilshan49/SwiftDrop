# deploy/compose/docker-compose.yml
# SwiftDrop - Local Development & Demonstration Environment
# Usage:
#   1. Copy deploy/compose/.env.example to deploy/compose/.env
#   2. Run: docker compose -f deploy/compose/docker-compose.yml up --build
#   To run infrastructure only:
#      docker compose -f deploy/compose/docker-compose.yml up -d postgres rabbitmq redis minio mailpit

services:

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: swiftdrop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: swiftdrop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"   # RabbitMQ Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: swiftdrop-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    # minio/minio and minio/mc are no longer published on Docker Hub or quay.io. bitnamilegacy/minio is the last
    # published build; it creates the delivery-proofs bucket itself (MINIO_DEFAULT_BUCKETS, public download).
    image: bitnamilegacy/minio:2025.7.23
    container_name: swiftdrop-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: delivery-proofs:download
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # MinIO Console
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: swiftdrop-mailpit
    ports:
      - "1025:1025"     # SMTP port
      - "8025:8025"     # Web UI
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/info || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── Microservices ───────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ../../
      dockerfile: services/auth-service/Dockerfile
    container_name: swiftdrop-auth-service
    ports:
      - "8081:8081"     # Exposed in dev for debugging
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  pricing-service:
    build:
      context: ../../
      dockerfile: services/pricing-service/Dockerfile
    container_name: swiftdrop-pricing-service
    ports:
      - "8082:8082"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  parcel-service:
    build:
      context: ../../
      dockerfile: services/parcel-service/Dockerfile
    container_name: swiftdrop-parcel-service
    ports:
      - "8083:8083"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  dispatch-service:
    build:
      context: ../../
      dockerfile: services/dispatch-service/Dockerfile
    container_name: swiftdrop-dispatch-service
    ports:
      - "8084:8084"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  merchant-service:
    build:
      context: ../../
      dockerfile: services/merchant-service/Dockerfile
    container_name: swiftdrop-merchant-service
    ports:
      - "8085:8085"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      parcel-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  notification-service:
    build:
      context: ../../
      dockerfile: services/notification-service/Dockerfile
    container_name: swiftdrop-notification-service
    ports:
      - "8086:8086"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      parcel-service:
        condition: service_healthy
      merchant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  ai-assistant:
    build:
      context: ../../
      dockerfile: services/ai-assistant/Dockerfile
    container_name: swiftdrop-ai-assistant
    ports:
      - "8087:8087"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      # Embedding model and native libraries, downloaded on the first start only
      - ai_model_cache:/app/onnx-cache
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # The first start downloads the embedding model (~90 MB) before it reports ready
      start_period: 300s
    restart: unless-stopped

  api-gateway:
    build:
      context: ../../
      dockerfile: services/api-gateway/Dockerfile
    container_name: swiftdrop-api-gateway
    ports:
      - "8080:8080"     # Public entry point for all API traffic
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      parcel-service:
        condition: service_healthy
      dispatch-service:
        condition: service_healthy
      merchant-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      ai-assistant:
        # Started, not healthy: a slow or broken assistant must not keep the rest of SwiftDrop offline
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        # Always /api in this image: nginx proxies it to the gateway. Not read from .env, because .env files copied
        # before 31 Oct have http://localhost:8080, which skips the /api prefix and breaks every request.
        VITE_API_BASE_URL: /api
        VITE_AUTH_BASE_URL: ${VITE_AUTH_BASE_URL:-http://localhost:8081}
        VITE_GOOGLE_LOGIN_ENABLED: ${VITE_GOOGLE_LOGIN_ENABLED:-false}
    container_name: swiftdrop-frontend
    ports:
      - "3000:80"       # React SPA accessible in browser
    env_file:
      - path: .env
        required: false
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: on Alpine localhost resolves to ::1 first and nginx listens on IPv4 only
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# ─── Volumes ─────────────────────────────────────────────────────────────────

volumes:
  pgdata:
    name: swiftdrop_pgdata
  rabbitmq_data:
    name: swiftdrop_rabbitmq_data
  ai_model_cache:
    name: swiftdrop_ai_model_cache
  minio_data:
    # New name for the Bitnami image, which runs as a non-root user: a volume made by the old image is owned by root
    name: swiftdrop_minio_bitnami_data

# ─── Networks ────────────────────────────────────────────────────────────────

networks:
  default:
    name: swiftdrop_net
