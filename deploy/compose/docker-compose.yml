# deploy/compose/docker-compose.yml
# SwiftDrop - Local Development & Demonstration Environment
# Usage:
#   1. Copy deploy/compose/.env.example to deploy/compose/.env
#   2. Run: docker compose -f deploy/compose/docker-compose.yml up --build
#   To run infrastructure only:
#      docker compose -f deploy/compose/docker-compose.yml up -d postgres rabbitmq redis minio minio-init mailpit

services:

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: swiftdrop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: swiftdrop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"   # RabbitMQ Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: swiftdrop-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: swiftdrop-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: swiftdrop-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/delivery-proofs;
        mc anonymous set download local/delivery-proofs;
        echo 'MinIO bucket delivery-proofs initialized.';
        exit 0"
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    container_name: swiftdrop-mailpit
    ports:
      - "1025:1025"     # SMTP port
      - "8025:8025"     # Web UI
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/info || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── Microservices ───────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ../../
      dockerfile: services/auth-service/Dockerfile
    container_name: swiftdrop-auth-service
    ports:
      - "8081:8081"     # Exposed in dev for debugging
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  pricing-service:
    build:
      context: ../../
      dockerfile: services/pricing-service/Dockerfile
    container_name: swiftdrop-pricing-service
    ports:
      - "8082:8082"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  parcel-service:
    build:
      context: ../../
      dockerfile: services/parcel-service/Dockerfile
    container_name: swiftdrop-parcel-service
    ports:
      - "8083:8083"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  dispatch-service:
    build:
      context: ../../
      dockerfile: services/dispatch-service/Dockerfile
    container_name: swiftdrop-dispatch-service
    ports:
      - "8084:8084"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  merchant-service:
    build:
      context: ../../
      dockerfile: services/merchant-service/Dockerfile
    container_name: swiftdrop-merchant-service
    ports:
      - "8085:8085"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      parcel-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  notification-service:
    build:
      context: ../../
      dockerfile: services/notification-service/Dockerfile
    container_name: swiftdrop-notification-service
    ports:
      - "8086:8086"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  ai-assistant:
    build:
      context: ../../
      dockerfile: services/ai-assistant/Dockerfile
    container_name: swiftdrop-ai-assistant
    ports:
      - "8087:8087"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  api-gateway:
    build:
      context: ../../
      dockerfile: services/api-gateway/Dockerfile
    container_name: swiftdrop-api-gateway
    ports:
      - "8080:8080"     # Public entry point for all API traffic
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      parcel-service:
        condition: service_healthy
      dispatch-service:
        condition: service_healthy
      merchant-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      ai-assistant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_AUTH_BASE_URL: ${VITE_AUTH_BASE_URL:-http://localhost:8081}
        VITE_GOOGLE_LOGIN_ENABLED: ${VITE_GOOGLE_LOGIN_ENABLED:-false}
    container_name: swiftdrop-frontend
    ports:
      - "3000:80"       # React SPA accessible in browser
    env_file:
      - path: .env
        required: false
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# ─── Volumes ─────────────────────────────────────────────────────────────────

volumes:
  pgdata:
    name: swiftdrop_pgdata
  rabbitmq_data:
    name: swiftdrop_rabbitmq_data
  minio_data:
    name: swiftdrop_minio_data

# ─── Networks ────────────────────────────────────────────────────────────────

networks:
  default:
    name: swiftdrop_net
