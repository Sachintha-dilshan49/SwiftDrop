apiVersion: v1
kind: Secret
metadata:
  name: swiftdrop-secrets
  labels:
    {{- include "swiftdrop.labels" . | nindent 4 }}
type: Opaque
data:
  internal-api-token: {{ .Values.secrets.internalApiToken | default "swiftdrop-internal-secret-token-change-in-production" | b64enc | quote }}
  jwt-private-key-b64: {{ .Values.secrets.jwtPrivateKeyB64 | default "demo-private-key" | b64enc | quote }}
  jwt-public-key-b64: {{ .Values.secrets.jwtPublicKeyB64 | default "demo-public-key" | b64enc | quote }}
  
  postgres-password: {{ .Values.secrets.postgresPassword | default "postgres" | b64enc | quote }}
  auth-db-password: {{ .Values.secrets.authDbPassword | default "auth" | b64enc | quote }}
  pricing-db-password: {{ .Values.secrets.pricingDbPassword | default "pricing" | b64enc | quote }}
  parcel-db-password: {{ .Values.secrets.parcelDbPassword | default "parcel" | b64enc | quote }}
  dispatch-db-password: {{ .Values.secrets.dispatchDbPassword | default "dispatch" | b64enc | quote }}
  merchant-db-password: {{ .Values.secrets.merchantDbPassword | default "merchant" | b64enc | quote }}
  notif-db-password: {{ .Values.secrets.notifDbPassword | default "notification" | b64enc | quote }}

  rabbitmq-password: {{ .Values.secrets.rabbitmqPassword | default "guest" | b64enc | quote }}
  minio-root-password: {{ .Values.secrets.minioRootPassword | default "minioadmin" | b64enc | quote }}
