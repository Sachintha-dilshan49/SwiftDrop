apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.notificationService.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
    spec:
      containers:
        - name: notification-service
          image: "{{ .Values.notificationService.image.repository }}:{{ .Values.notificationService.image.tag | default .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.notificationService.image.pullPolicy | default .Values.global.image.pullPolicy }}
          ports:
            - containerPort: 8086
              name: http
          envFrom:
            - configMapRef:
                name: swiftdrop-config
          env:
            - name: NOTIFICATION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: notif-db-password
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: rabbitmq-password
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: internal-api-token
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.notificationService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8086
      targetPort: 8086
      name: http
  selector:
    app.kubernetes.io/name: notification-service
