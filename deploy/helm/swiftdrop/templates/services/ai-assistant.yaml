apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-assistant
  labels:
    app.kubernetes.io/name: ai-assistant
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.aiAssistant.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-assistant
    spec:
      containers:
        - name: ai-assistant
          image: "{{ .Values.aiAssistant.image.repository }}:{{ .Values.aiAssistant.image.tag | default .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.aiAssistant.image.pullPolicy | default .Values.global.image.pullPolicy }}
          ports:
            - containerPort: 8087
              name: http
          envFrom:
            - configMapRef:
                name: swiftdrop-config
          env:
            - name: GATEWAY_URL
              value: "http://api-gateway:8080"
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: internal-api-token
          volumeMounts:
            - name: ai-model-cache
              mountPath: /app/onnx-cache
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8087
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8087
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.aiAssistant.resources | nindent 12 }}
      volumes:
        - name: ai-model-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-assistant
  labels:
    app.kubernetes.io/name: ai-assistant
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8087
      targetPort: 8087
      name: http
  selector:
    app.kubernetes.io/name: ai-assistant
