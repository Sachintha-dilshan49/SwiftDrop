apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.authService.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
    spec:
      containers:
        - name: auth-service
          image: "{{ .Values.authService.image.repository }}:{{ .Values.authService.image.tag | default .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.authService.image.pullPolicy | default .Values.global.image.pullPolicy }}
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: swiftdrop-config
          env:
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: auth-db-password
            - name: JWT_PRIVATE_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: jwt-private-key-b64
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: internal-api-token
            - name: AUTH_GOOGLE_ENABLED
              value: {{ .Values.authService.googleEnabled | default "false" | quote }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.authService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  selector:
    app.kubernetes.io/name: auth-service
