apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-service
  labels:
    app.kubernetes.io/name: pricing-service
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.pricingService.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricing-service
    spec:
      containers:
        - name: pricing-service
          image: "{{ .Values.pricingService.image.repository }}:{{ .Values.pricingService.image.tag | default .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.pricingService.image.pullPolicy | default .Values.global.image.pullPolicy }}
          ports:
            - containerPort: 8082
              name: http
          envFrom:
            - configMapRef:
                name: swiftdrop-config
          env:
            - name: PRICING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: pricing-db-password
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: internal-api-token
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.pricingService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-service
  labels:
    app.kubernetes.io/name: pricing-service
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
      name: http
  selector:
    app.kubernetes.io/name: pricing-service
