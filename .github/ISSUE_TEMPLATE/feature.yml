name: Feature / task
description: A piece of work for one person
labels: ["feature"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [gateway, auth, pricing, parcel, dispatch, merchant, notification, ai, frontend, common, deploy, ci, docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What needs to be done
      description: Describe the outcome, not the implementation.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Acceptance criteria as a checklist.
      value: |
        - [ ]
        - [ ] Tests added
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issue numbers this is blocked by, if any.
