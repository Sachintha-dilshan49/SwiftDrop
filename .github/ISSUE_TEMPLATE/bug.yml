name: Bug
description: Something does not work as expected
labels: ["bug"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [gateway, auth, pricing, parcel, dispatch, merchant, notification, ai, frontend, common, deploy, ci, docs]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any personal data, tokens or passwords first.
